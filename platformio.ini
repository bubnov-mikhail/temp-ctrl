[env:nanoatmega328]
platform = atmelavr
board = uno
framework = arduino
lib_ldf_mode = chain+
lib_deps = 
	SPI
	Wire
	Time
	https://github.com/platisd/nokia-5110-lcd-library.git@^2.7.2
	adafruit/DHT sensor library@^1.4.6
	gyverlibs/EncButton@^3.7.4
